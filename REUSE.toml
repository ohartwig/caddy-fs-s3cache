version = 1
SPDX-PackageName = "caddy-fs-s3cache"
SPDX-PackageSupplier = "Kai Ole Hartwig <mail@ole-hartwig.eu>"
SPDX-PackageDownloadLocation = "https://github.com/ohartwig/caddy-fs-s3cache"

# Config, metadata and repo-template files: no comment syntax that survives
# their tooling (go.sum, JSON), generated by tooling (CHANGELOG.md) or copied
# verbatim from devops/repo-templates, where a per-file header would drift.
[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    ".gitsigners",
    ".gitsigners.d/**",
    ".markdownlint.jsonc",
    ".markdownlint-cli2.jsonc",
    ".mise.toml",
    "go.mod",
    "go.sum",
    "lefthook.yml",
    "CHANGELOG.md",
    "CLAUDE.md",
    "SECURITY.md",
    ".well-known/security.txt",
    ".gitlab/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kai Ole Hartwig"
SPDX-License-Identifier = "MIT"
